[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "our-family-ledger"
version = "0.1.0"
description = "Family ledger CLI — SQLite-backed, AI-assisted expense tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
ledger = "our_family_ledger.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["our_family_ledger"]
